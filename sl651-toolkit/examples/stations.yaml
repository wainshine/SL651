# SL651 设备模拟器 - 多站点配置示例
# 启动方式: python tools/simulate_cli.py --config examples/stations.yaml

sender:
  proto: mqtt
  broker: 127.0.0.1:1883
  topic: "sl651/{station_addr}/uplink"

stations:
  - type: water_level
    addr: "0000000001"
    center: 1
    password: 0
    interval: 60
    base_level: 5.0

  - type: rain
    addr: "0000000002"
    center: 1
    password: 0
    interval: 60

  - type: soil
    addr: "0000000003"
    center: 1
    password: 0
    interval: 300
